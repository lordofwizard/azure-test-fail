name: Run Pytest Tests

on:
  push:
    branches:
      - feature/testing-py-test-for-local-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    
    - name: Run pytest
      run: |
        pytest test.py -v
